<!doctype html>
<html lang="en" data-theme="notebook">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read, listen and write in English — lessons from Starter to C1." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Folio English</title>
    <script>
      // Sayfa açılırken tema/koyu mod yanıp sönmesin diye ayarlar erkenden uygulanır
      try {
        var s = JSON.parse(localStorage.getItem('folio:settings') || '{}')
        var r = document.documentElement
        if (s.theme) r.dataset.theme = s.theme
        var m = s.mode || 'auto'
        r.dataset.scheme = m === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
